[package]
name = "minimoon-sync-server"
version = "0.2.0"
edition = "2021"
description = "Standalone LAN file sharing server for Minimoon Sync"
license = "MIT"
repository = "https://github.com/milesegan/minimoon-sync-server"
readme = "README.md"
keywords = ["sync", "music", "lan", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lib]
name = "minimoon_sync_server"
path = "src/lib.rs"

[[bin]]
name = "minimoon-sync-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
gethostname = "1.1.0"
glob = "0.3.4"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
percent-encoding = "2.3.2"

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tower = "0.5.3"
