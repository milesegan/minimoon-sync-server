[package]
name = "minimoon-sync-server"
version = "0.2.0"
edition = "2021"
description = "Standalone LAN file sharing server for Minimoon Sync"
license = "MIT"
repository = "https://github.com/milesegan/minimoon-sync-server"
readme = "README.md"
keywords = ["sync", "music", "lan", "server"]
categories = ["command-line-utilities", "web-programming::http-server"]

[lib]
name = "minimoon_sync_server"
path = "src/lib.rs"

[[bin]]
name = "minimoon-sync-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
gethostname = "1.1.0"
glob = "0.3.3"
libc = "0.2.184"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.51.1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json"] }
tower = "0.5.2"
